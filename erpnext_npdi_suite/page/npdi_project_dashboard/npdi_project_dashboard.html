<div class="npdi-dashboard-wrapper page-body">
    <!-- Header Controls -->
    <div class="row align-items-center mb-4">
        <div class="col-md-4">
            <label class="form-label text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">Proyecto Seleccionado</label>
            <div id="npdi-project-selector-container"></div>
        </div>
        <div class="col-md-8 text-end">
            <button class="btn btn-sm btn-outline-secondary me-2" id="btn-recalc-cpm">
                <i class="octicon octicon-sync"></i> Recalcular Ruta Crítica
            </button>
            <button class="btn btn-sm btn-primary" id="btn-capture-baseline">
                <i class="octicon octicon-device-camera"></i> Congelar Línea Base (Baseline)
            </button>
        </div>
    </div>

    <!-- Metadatos y Resumen Ejecutivo -->
    <div class="card mb-4 border-0 shadow-sm">
        <div class="card-body bg-light rounded">
            <div class="row text-center">
                <div class="col-sm-3 border-end">
                    <span class="text-muted d-block" style="font-size: 0.8rem;">Inicio Proyectado</span>
                    <strong id="meta-start-date" class="text-dark">-</strong>
                </div>
                <div class="col-sm-3 border-end">
                    <span class="text-muted d-block" style="font-size: 0.8rem;">Lanzamiento Objetivo (Launch)</span>
                    <strong id="meta-launch-date" class="text-success">-</strong>
                </div>
                <div class="col-sm-3 border-end">
                    <span class="text-muted d-block" style="font-size: 0.8rem;">Estado de Línea Base</span>
                    <span id="meta-baseline-status" class="badge bg-secondary">Sin Capturar</span>
                </div>
                <div class="col-sm-3">
                    <span class="text-muted d-block" style="font-size: 0.8rem;">Variante de Desarrollo</span>
                    <strong id="meta-variant" class="text-primary">-</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Vistas del Proyecto: Tabs -->
    <ul class="nav nav-tabs mb-3" id="npdi-view-tabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="grid-tab" data-bs-toggle="tab" data-bs-target="#tab-grid" type="button" role="tab">
                <i class="octicon octicon-list-unordered me-1"></i> Vista de Tareas por Módulo
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="gantt-tab" data-bs-toggle="tab" data-bs-target="#tab-gantt" type="button" role="tab">
                <i class="octicon octicon-project me-1"></i> Diagrama de Gantt Proyectado
            </button>
        </li>
    </ul>

    <!-- Contenido de los Tabs -->
    <div class="tab-content" id="npdi-tab-content">
        <!-- Tab 1: Grid por Módulos -->
        <div class="tab-pane fade show active" id="tab-grid" role="tabpanel">
            <div id="npdi-modules-container">
                <p class="text-muted text-center my-5 py-5">Selecciona un proyecto en la parte superior para cargar la estructura de tareas.</p>
            </div>
        </div>

        <!-- Tab 2: Gantt View -->
        <div class="tab-pane fade" id="tab-gantt" role="tabpanel">
            <div class="border rounded p-3 bg-white min-vh-50" id="gantt-target-wrapper">
                <div id="frappe-gantt-render-area"></div>
            </div>
        </div>
    </div>
</div>
